# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Playwright CI
# Copy this file to .github/workflows/playwright.yml to enable CI.
#
# Runs the EPAM Services → Client Work test suite on every push / PR to main.
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: "Playwright – EPAM Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Install Playwright browsers ──────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 5. Run tests ────────────────────────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test tests/epam/ --project=chromium --reporter=html
        env:
          CI: true

      # ── 6. Upload HTML report ────────────────────────────────────────────────
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # ── 7. Upload test results (traces / videos / screenshots) ───────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
